[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stock-price-movement"
version = "0.1.0"
description = "Source-backed personal investment research, starting with Alphabet."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2,<3"]

[project.scripts]
stock-price-movement = "stock_price_movement.cli:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_price_movement"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
